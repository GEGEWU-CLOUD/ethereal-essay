<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>冰雪随笔 · 江畔何人初见雪、江雪何年初映人</title>
    <link id="dynamicFavicon" rel="icon" type="image/webp" href="https://gegewu-cloud.github.io/img/zznnlogo.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-primary: #e8f0f8;
            --bg-card: #ffffff;
            --text-primary: #1a2740;
            --text-secondary: #4a6080;
            --border-light: #d8e4f0;
            --tag-bg: #e0ecf6;
            --tag-text: #3a5070;
            --code-bg: #0f172a;
            --code-text: #e2e8f0;
            --desc-bg: #f4f8fc;
            --desc-border: #6b9bd2;
            /* 内容区透明度（1=完全不透明，越低越透明） */
            --main-alpha: 0.92;
            --btn-outline: #5b8cc9;
            --btn-primary-bg: #1a2740;
            --btn-primary-text: white;
            --modal-bg: white;
            --shadow: 0 4px 12px rgba(100,140,180,0.08);
            --sync-panel-bg: white;
            --search-bg: #f0f5fa;
            --sidebar-bg: #f8fafd;
            --sidebar-width: 240px;
            --navbar-height: 64px;
            /* 渐变色变量 - 冰雪主题 */
            --grad-brand: linear-gradient(135deg, #88b8e8, #a78bfa);
            --grad-accent: linear-gradient(135deg, #6b9bd2, #8b9dc3);
            --grad-primary: linear-gradient(135deg, #2c4a7c, #5b6abf);
            --grad-card: linear-gradient(145deg, #ffffff, #f4f8fc);
            --grad-sidebar-active: linear-gradient(90deg, rgba(107,155,210,0.15), rgba(139,157,195,0.05));
            --grad-toggle: linear-gradient(135deg, #88b8e8, #a78bfa);
            /* 柔和渐变底 - 用于 logo 区、gist 设置、目录搜索框、全部 等 */
            --soft-tint: linear-gradient(135deg, rgba(136,184,232,0.18), rgba(167,139,250,0.16));
        }

        body.dark-mode {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-light: #334155;
            --tag-bg: #334155;
            --tag-text: #cbd5e1;
            --code-bg: #020617;
            --code-text: #cbd5e6;
            --desc-bg: #1e293b;
            --desc-border: #60a5fa;
            --main-alpha: 0.92;
            --btn-outline: #60a5fa;
            --btn-primary-bg: #60a5fa;
            --btn-primary-text: #0f172a;
            --modal-bg: #1e293b;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
            --sync-panel-bg: #1e293b;
            --search-bg: #334155;
            --sidebar-bg: #1e293b;
            /* 渐变色变量(暗色) */
            --grad-brand: linear-gradient(135deg, #818cf8, #a78bfa);
            --grad-accent: linear-gradient(135deg, #60a5fa, #818cf8);
            --grad-primary: linear-gradient(135deg, #60a5fa, #a78bfa);
            --grad-card: linear-gradient(145deg, #1e293b, #1a2332);
            --grad-sidebar-active: linear-gradient(90deg, rgba(96,165,250,0.18), rgba(129,140,248,0.06));
            --grad-toggle: linear-gradient(135deg, #818cf8, #c084fc);
            --soft-tint: linear-gradient(135deg, rgba(129,140,248,0.18), rgba(192,132,252,0.14));
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(160deg, #e3edf7 0%, #eef4f9 30%, #f2f6fb 60%, #e8f0f8 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', 'SF Pro Text', 'Inter', system-ui, sans-serif;
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.2s ease;
            min-height: 100vh;
        }
        body.dark-mode {
            background: var(--bg-primary);
        }

        /* ==================== TOP NAVBAR ==================== */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: var(--navbar-height);
            margin-left: 0;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-bottom: 1px solid transparent;
            box-shadow: none;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            gap: 1.2rem;
            transition: background 0.3s ease, margin-left 0.3s ease, box-shadow 0.3s ease;
        }
        body.past-hero .top-nav {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
        }
        body.dark-mode.past-hero .top-nav { box-shadow: 0 1px 8px rgba(0,0,0,0.25); }
        @media (min-width: 769px) {
            body.past-hero .top-nav { margin-left: var(--sidebar-width); }
        }

        /* ==================== HERO（全屏首屏，Butterfly 风格）==================== */
        .hero {
            height: 100vh;
            min-height: 520px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            background: linear-gradient(160deg, #16325f 0%, #2c4a7c 40%, #4a5fa8 72%, #6b7fd4 100%);
            color: #fff;
        }
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.12), transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.10), transparent 45%);
            pointer-events: none;
        }
        /* 内容区有图片背景、且未单独设置首屏背景时：首屏透出内容背景图（不加遮罩） */
        body.has-bg-image:not(.has-hero-bg) .hero { background: transparent; }
        body.has-bg-image .hero::before { background: none; }
        body.has-hero-bg .hero::before { background: none; }
        /* 夜间模式：首屏整体压暗一点 */
        body.dark-mode .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: 1;
        }
        .hero-inner { position: relative; z-index: 2; padding: 0 1.5rem; }
        .hero-title {
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', 'STCaiyun', 'YouYuan', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            margin-bottom: 0.8rem;
            /* 冰雪艺术字：冰蓝渐变 + 描边 + 发光 */
            background: linear-gradient(180deg, #eaf6ff 0%, #b6e0ff 22%, #ffffff 50%, #9bd0ff 72%, #cfeaff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-stroke: 1px rgba(120,180,255,0.35);
            filter: drop-shadow(0 2px 6px rgba(70,140,255,0.55)) drop-shadow(0 0 18px rgba(120,190,255,0.35));
        }
        .hero-subtitle {
            font-family: 'Ma Shan Zheng', 'ZCOOL KuaiLe', 'KaiTi', 'STKaiti', cursive;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            margin-bottom: 0;
            /* 冰雪艺术字：与标题呼应的冰蓝渐变 + 发光 */
            background: linear-gradient(135deg, #cfeaff 0%, #ffffff 45%, #a5b4fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 1px 4px rgba(120,190,255,0.5));
        }
        .hero-scroll-hint {
            position: absolute;
            left: 50%;
            bottom: 2.2rem;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            color: rgba(255,255,255,0.85);
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            z-index: 2;
            cursor: pointer;
        }
        .hero-scroll-hint i { font-size: 1.4rem; animation: hero-bounce 1.8s infinite; }
        @keyframes hero-bounce {
            0%, 100% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(8px); opacity: 0.5; }
        }
        @media (max-width: 480px) {
            .hero-title { font-size: 2.2rem; }
            .hero-subtitle { font-size: 0.95rem; }
        }
        /* 首屏时隐藏侧边栏与内容左边距（桌面端） */
        @media (min-width: 769px) {
            body:not(.past-hero) .sidebar { transform: translateX(-100%); }
            body:not(.past-hero) .main-content { margin-left: 0; }
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-shrink: 0;
            text-decoration: none;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: var(--grad-brand);
            border-radius: 28px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .nav-logo img { width: 100%; height: 100%; object-fit: cover; }
        .nav-logo span { font-size: 1.5rem; }
        .nav-brand-text {
            font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', 'STCaiyun', 'YouYuan', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e6ec7, #6b9bd2, #4a90d9);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            white-space: nowrap;
            filter: drop-shadow(0 1px 3px rgba(70,140,255,0.35));
        }
        body.dark-mode .nav-brand-text {
            background: linear-gradient(135deg, #cfeaff, #a5b4fc, #e2e8f0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            filter: drop-shadow(0 1px 4px rgba(120,190,255,0.5));
        }
        .nav-brand-btns { display: flex; gap: 4px; }
        .nav-brand-btns button {
            background: var(--tag-bg);
            border: none;
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            font-size: 0.6rem;
            cursor: pointer;
            color: var(--text-secondary);
            white-space: nowrap;
            transition: 0.2s;
        }
        .nav-brand-btns button:hover { background: var(--btn-outline); color: white; }

        /* logo 区移入侧边栏顶部 */
        .sidebar .nav-brand {
            margin: 0.6rem 0.8rem 0.3rem;
            padding: 0.55rem 0.7rem;
            border-radius: 12px;
            flex-wrap: wrap;
        }

        /* 首屏（未滚动）时顶部导航栏显示 logo */
        .topnav-brand {
            display: none;
            margin-right: 0.25rem;
        }
        body:not(.past-hero) .topnav-brand {
            display: flex;
        }
        body:not(.past-hero) .topnav-brand .nav-logo {
            background: rgba(255,255,255,0.16);
        }
        body:not(.past-hero) .topnav-brand .nav-brand-text {
            background: linear-gradient(135deg, #cfeaff, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 1px 4px rgba(120,190,255,0.5));
        }

        /* 首屏：导航栏按钮去色（透明底、白色图标文字） */
        body:not(.past-hero) .nav-actions .btn,
        body:not(.past-hero) .nav-actions .theme-toggle {
            background: transparent;
            border-color: rgba(255,255,255,0.35);
            color: #fff;
        }
        body:not(.past-hero) #uploadToGistNavBtn,
        body:not(.past-hero) #downloadFromGistNavBtn {
            background: transparent;
            border-color: rgba(255,255,255,0.35);
            color: #fff;
            box-shadow: none;
        }
        body:not(.past-hero) #bgImageBtn { background: transparent !important; }
        body:not(.past-hero) .nav-actions .btn:hover,
        body:not(.past-hero) .nav-actions .theme-toggle:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        body:not(.past-hero) #uploadToGistNavBtn:hover,
        body:not(.past-hero) #downloadFromGistNavBtn:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
            transform: none;
            box-shadow: none;
        }
        body:not(.past-hero) .nav-search {
            background: transparent;
            border-color: rgba(255,255,255,0.35);
        }
        body:not(.past-hero) .nav-search span,
        body:not(.past-hero) .nav-search input {
            color: #fff;
        }
        body:not(.past-hero) .nav-search input::placeholder { color: rgba(255,255,255,0.7); }

        .nav-search {
            width: 40px;
            flex-shrink: 1;
            min-width: 40px;
            display: flex;
            align-items: center;
            background: var(--search-bg);
            border-radius: 40px;
            padding: 0.3rem 0.55rem;
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: width 0.3s ease, border-color 0.2s, box-shadow 0.2s;
        }
        .nav-search.expanded {
            width: 220px;
            cursor: text;
        }
        .nav-search:focus-within {
            border-color: #6b9bd2;
            box-shadow: 0 0 0 3px rgba(107,155,210,0.12);
        }
        .nav-search span { flex-shrink: 0; margin-right: 0; transition: margin-right 0.3s ease; }
        .nav-search.expanded span { margin-right: 6px; }
        .nav-search input {
            border: none; background: transparent; padding: 0; width: 0;
            outline: none; color: var(--text-primary); font-size: 0.9rem;
            opacity: 0;
            transition: width 0.3s ease, opacity 0.2s ease, padding 0.3s ease;
        }
        .nav-search.expanded input {
            width: 100%;
            opacity: 1;
            padding: 0.6rem 0;
        }
        .nav-search input::placeholder { color: var(--text-secondary); }

        .nav-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
            flex-wrap: nowrap;
            margin-left: auto;
        }

        /* sidebar toggle (mobile) */
        .sidebar-toggle {
            display: none;
            background: var(--tag-bg);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 0.4rem 0.6rem;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-primary);
            line-height: 1;
        }

        /* ==================== SIDEBAR ==================== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-light);
            overflow-y: auto;
            z-index: 120;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, background 0.3s ease;
            padding-bottom: 1rem;
        }
        /* 侧边栏拖动柄 */
        .sidebar-resize-handle {
            position: absolute;
            top: 0;
            right: -3px;
            width: 8px;
            height: 100%;
            cursor: col-resize;
            z-index: 10;
            transition: background 0.15s;
        }
        .sidebar-resize-handle:hover,
        .sidebar-resize-handle.dragging {
            background: rgba(107,155,210,0.45);
        }
        body.dark-mode .sidebar-resize-handle:hover,
        body.dark-mode .sidebar-resize-handle.dragging {
            background: rgba(96,165,250,0.5);
        }
        }
        .sidebar-header {
            padding: 1rem 1rem 0.7rem;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-light);
            margin: 0 0 0.4rem;
        }
        .category-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 0.6rem;
        }
        .sticky-all-wrapper {
            position: sticky;
            top: 0;
            z-index: 5;
            padding: 2px 0;
            background: var(--sidebar-bg);
            transition: background 0.3s ease;
        }
        .category-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 0.6rem 1rem;
            margin: 2px 0;
            border: none;
            border-radius: 10px;
            background: transparent;
            cursor: pointer;
            font-size: 0.88rem;
            color: var(--text-primary);
            text-align: left;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .category-item:hover {
            background: linear-gradient(90deg, rgba(107,155,210,0.14), rgba(107,155,210,0.03));
            border-left: 3px solid #6b9bd2;
            transform: translateX(4px);
        }
        body.dark-mode .category-item:hover {
            background: linear-gradient(90deg, rgba(129,140,248,0.16), rgba(129,140,248,0.04));
            border-left: 3px solid #818cf8;
        }
        .category-item.active {
            background: var(--grad-sidebar-active);
            border-left: 3px solid #6b9bd2;
            color: #5b8cc9;
            font-weight: 600;
        }
        body.dark-mode .category-item.active {
            background: var(--grad-sidebar-active);
            border-left: 3px solid #818cf8;
            color: #60a5fa;
        }
        .category-item .cat-icon { font-size: 1rem; flex-shrink: 0; }
        .category-item .cat-count {
            margin-left: auto;
            font-size: 0.7rem;
            background: var(--tag-bg);
            padding: 0.1rem 0.5rem;
            border-radius: 20px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .category-item.active .cat-count {
            background: var(--grad-accent);
            color: white;
        }
        body.dark-mode .category-item.active .cat-count {
            background: var(--grad-accent);
            color: #0f172a;
        }

        /* 分类操作按钮 */
        .category-item-wrapper {
            display: flex;
            align-items: center;
            position: relative;
        }
        .category-item-wrapper .category-item {
            flex: 1;
            min-width: 0;
        }
        .cat-more-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-secondary);
            padding: 0 0.2rem;
            line-height: 1;
            border-radius: 4px;
            flex-shrink: 0;
            opacity: 0.5;
            transition: opacity 0.15s;
            margin-right: 4px;
        }
        .category-item-wrapper:hover .cat-more-btn { display: block; }
        .cat-more-btn:hover { opacity: 1; background: var(--border-light); }

        /* 图标选择器 */
        .icon-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }
        .icon-picker button {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 2px solid transparent;
            background: var(--tag-bg);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .icon-picker button:hover { border-color: #6b9bd2; background: rgba(107,155,210,0.08); transform: scale(1.1); }
        .icon-picker button.selected { border-color: #6b9bd2; background: linear-gradient(135deg, rgba(107,155,210,0.12), rgba(120,165,215,0.08)); box-shadow: 0 2px 8px rgba(107,155,210,0.2); }

        /* 分类操作弹出菜单 */
        .cat-action-menu {
            display: none;
            position: fixed;
            background: var(--modal-bg);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            z-index: 300;
            min-width: 130px;
            overflow: hidden;
            padding: 0.3rem 0;
        }
        .cat-action-menu.show { display: block; }
        .cat-action-menu button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 0.55rem 1rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.82rem;
            color: var(--text-primary);
            text-align: left;
            transition: background 0.12s;
        }
        .cat-action-menu button:hover { background: var(--tag-bg); }
        .cat-action-menu button.danger { color: #ef4444; }
        .cat-action-menu button.danger:hover { background: #fef2f2; }
        body.dark-mode .cat-action-menu button.danger:hover { background: #3b1a1a; }

        .sidebar-add-cat {
            margin: 0.6rem 1rem;
            padding: 0.55rem 1rem;
            border: dashed 1.5px var(--text-secondary);
            border-radius: 10px;
            background: transparent;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .sidebar-add-cat:hover { border-color: #6b9bd2; color: #6b9bd2; background: linear-gradient(135deg, rgba(107,155,210,0.04), rgba(120,165,215,0.02)); }

        .sidebar-sync-header {
            margin: 0.5rem 0.8rem 0;
            padding: 0.5rem 0.7rem;
            background: var(--tag-bg);
            border-radius: 10px;
            font-size: 0.72rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
            user-select: none;
            border-left: 3px solid transparent;
        }
        .sidebar-sync-header:hover { background: var(--border-light); }
        .sidebar-sync-header .sync-icon {
            width: 24px; height: 24px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;

        .command-card {

        .card-header { padding: 0.9rem 1.1rem 0.6rem; display: flex; justify-content: space-between; flex-wrap: wrap; border-bottom: 1px solid var(--border-light); gap: 0.5rem; position: relative; }

            transform: translateX(-50%);

            font-size: 0.78rem;
            display: block;
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
            transition: background 0.15s, color 0.15s;
            border-left: 2px solid transparent;

            color: #93c5fd;
            border-left-color: #60a5fa;

        .fullscreen-desc h3, .fullscreen-desc h4, .fullscreen-desc h5, .fullscreen-desc h6 {
            scroll-margin-top: 80px;
        }

        /* ========== 全屏布局：左侧内容 + 右侧目录侧边栏 ========== */
        .fullscreen-layout {
            display: flex;
            align-items: flex-start;
            gap: 0;
        }
        .fullscreen-main {
            flex: 1;
            min-width: 0;
            padding-right: 1.5rem;
        }
        .fullscreen-toc-sidebar {
            width: 260px;
            flex-shrink: 0;
            position: sticky;
            top: 1rem;
            border-left: 1px solid var(--border-light);
            padding-left: 1.2rem;
        }
        .fullscreen-toc-inner {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            padding-top: 0.5rem;
        }
        .fullscreen-toc-title {
            font-size: 0.9rem;
            font-weight: 700;

            margin-bottom: 0.6rem;
            padding-bottom: 0.5rem;

        /* 侧边栏中的 TOC 微调 */

            border: none;

            padding: 0;
            margin-bottom: 0;

        .fullscreen-toc-sidebar .md-toc-header {

    // ==================== 代码高亮 ====================
    function highlightCode(code, lang = 'bash') {
        if (!code) return '';
        const trimmedLang = (lang || 'bash').toLowerCase();
        try {
            if (trimmedLang && hljs.getLanguage(trimmedLang)) {
                return hljs.highlight(code, { language: trimmedLang }).value;
            } else {
                let detected = 'plaintext';
                if (code.includes('version:') && code.includes('services:')) detected = 'yaml';
                else if (code.includes('docker') || code.includes('kubectl')) detected = 'bash';
                return hljs.highlight(code, { language: detected }).value;
            }
        } catch(e) { return escapeHtml(code); }
    }

    function normalizeCommand(cmd) {
        if (!cmd.codeLang) cmd.codeLang = 'bash';
        if (!cmd.category) cmd.category = '其他';
        if (!cmd.subCategory) cmd.subCategory = '';
        if (!cmd.subSubCategory) cmd.subSubCategory = '';
        if (!cmd.description) cmd.description = '';
        if (!cmd.example) cmd.example = '';
        if (!cmd.codeBlocks) cmd.codeBlocks = [];
        if (!cmd.codeTitle) cmd.codeTitle = '';
        if (!cmd.cardTitle) cmd.cardTitle = '';
        // Normalize each code block
        cmd.codeBlocks = cmd.codeBlocks.map(b => ({ name: b.name || '', codeLang: b.codeLang || 'bash', title: b.title || '' }));
        return cmd;
    }

    async function uploadToGist() {
        if(!gistToken) { alert('请先输入 GitHub Token 并点击"保存配置"'); return; }
        const commandsData = await getAll();
        const content = JSON.stringify(commandsData, null, 2);
        const files = { 'command_master_db.json': { content: content } };
        try {
            let url = 'https://api.github.com/gists';
            let method = 'POST';
            let body = { description: 'Command DB', public: false, files: files };
            if(gistId) { url = `https://api.github.com/gists/${gistId}`; method = 'PATCH'; body = { files: files }; }
            const response = await fetch(url, { method: method, headers: { 'Authorization': `token ${gistToken}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' }, body: JSON.stringify(body) });
            if(response.ok) {
                const data = await response.json();
                if(!gistId) { gistId = data.id; localStorage.setItem('gist_id', gistId); document.getElementById('gistIdInput').value = gistId; updateSyncStatus(); }
                alert('✅ 上传成功！');
            } else { alert('❌ 上传失败: ' + response.status); }
        } catch(e) { alert('网络错误: ' + e.message); }
    }

    async function downloadFromGist() {
        if(!gistToken || !gistId) { alert('请先配置 Token 和 Gist ID'); return; }
        try {
            const response = await fetch(`https://api.github.com/gists/${gistId}`, { headers: { 'Authorization': `token ${gistToken}`, 'Accept': 'application/vnd.github.v3+json' } });
            if(response.ok) {
                const data = await response.json();
                const fileContent = data.files['command_master_db.json']?.content;
                if(fileContent) {
                    const remoteCommands = JSON.parse(fileContent);
                    if(Array.isArray(remoteCommands) && remoteCommands.length > 0) {
                        if(confirm(`拉取到 ${remoteCommands.length} 条命令，是否覆盖本地数据？`)) {
                            await bulkImport(remoteCommands.map(c => normalizeCommand(c)));
                            await refresh();
                            alert('✅ 同步成功！');
                        }
                    } else { alert('Gist中没有有效的命令数据'); }
                } else { alert('Gist中未找到 command_master_db.json 文件'); }
            } else { alert('❌ 拉取失败: ' + response.status); }
        } catch(e) { alert('网络错误: ' + e.message); }
    }

    function buildFaviconUrl(type, value) {
        if (type === 'emoji') {
            const emoji = value || '🐾';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#6b9bd2"/><text x="50" y="72" font-size="52" text-anchor="middle" fill="white" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">${emoji}</text></svg>`;
            return 'data:image/svg+xml,' + encodeURIComponent(svg);
        } else if (type === 'image' && value) { return value; }
        else if (type === 'text' && value) {
            const shortText = value.substring(0, 2);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#6b9bd2" rx="20"/><text x="50" y="68" font-size="44" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="bold">${shortText}</text></svg>`;
            return 'data:image/svg+xml,' + encodeURIComponent(svg);
        }
        return '';
    }

    // ==================== IndexedDB ====================
    const DB_NAME = 'CommandMasterDB', STORE_NAME = 'commands';
    let db = null, commands = [];

    function openDB() { return new Promise((res, rej) => { const r = indexedDB.open(DB_NAME, 5); r.onerror = () => rej(r.error); r.onsuccess = () => { db = r.result; res(db); }; r.onupgradeneeded = e => { if(!e.target.result.objectStoreNames.contains(STORE_NAME)) e.target.result.createObjectStore(STORE_NAME, { keyPath: 'id' }); }; }); }
    async function getAll() { if(!db) await openDB(); return new Promise((res, rej) => { const tx = db.transaction(STORE_NAME, 'readonly'); const req = tx.objectStore(STORE_NAME).getAll(); req.onsuccess = () => res((req.result || []).map(normalizeCommand)); req.onerror = () => rej(req.error); }); }
    async function saveCmd(cmd) { if(!db) await openDB(); return new Promise((res, rej) => { const tx = db.transaction(STORE_NAME, 'readwrite'); tx.objectStore(STORE_NAME).put(cmd); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
    async function delCmd(id) { if(!db) await openDB(); return new Promise((res, rej) => { const tx = db.transaction(STORE_NAME, 'readwrite'); tx.objectStore(STORE_NAME).delete(id); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
    async function bulkImport(cmds) { if(!db) await openDB(); const tx = db.transaction(STORE_NAME, 'readwrite'); const store = tx.objectStore(STORE_NAME); await store.clear(); for(const c of cmds) store.put(normalizeCommand(c)); return new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = rej; }); }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

    // 模糊搜索：支持子串匹配 + 字符顺序（子序列）匹配
    function fuzzyMatch(query, text) {
        query = (query || '').toLowerCase();
        text = (text || '').toLowerCase();
        if (!query) return true;
        if (text.includes(query)) return true;
        let qi = 0;
        for (let ti = 0; ti < text.length && qi < query.length; ti++) {
            if (text[ti] === query[qi]) qi++;
        }
        return qi === query.length;
    }

    // 模糊匹配高亮：按字符顺序标记匹配到的字符
    function fuzzyHighlight(text, query) {
        if (!query) return escapeHtml(text);
        const q = query.toLowerCase();
        const lower = text.toLowerCase();
        let out = '', qi = 0;
        for (let ti = 0; ti < text.length; ti++) {
            if (qi < q.length && lower[ti] === q[qi]) {
                out += '<mark class="cat-search-mark">' + escapeHtml(text[ti]) + '</mark>';
                qi++;
            } else {
                out += escapeHtml(text[ti]);
            }
        }
        return out;
    }

    // ==================== 子目录（一级 + 二级，共三级）====================
    // cat_subdirs: { 分类: { 一级子目录: [二级子目录, ...] } }
    function loadSubdirs() { try { return JSON.parse(localStorage.getItem('cat_subdirs') || '{}'); } catch(e) { return {}; } }
    function saveSubdirs(map) { localStorage.setItem('cat_subdirs', JSON.stringify(map)); }
    function getSubdirs(cat) {
        const map = loadSubdirs();
        const subs = new Set(Object.keys(map[cat] || {}));
        commands.forEach(c => { if (c.category === cat && c.subCategory) subs.add(c.subCategory); });
        return Array.from(subs).sort();
    }
    function getSubSubdirs(cat, sub) {
        const map = loadSubdirs();
        const subs = new Set((map[cat] && map[cat][sub]) || []);
        commands.forEach(c => { if (c.category === cat && c.subCategory === sub && c.subSubCategory) subs.add(c.subSubCategory); });
        return Array.from(subs).sort();
    }
    let pendingSubdir = null; // { parent, sub } — sub 为空表示一级子目录
    function openAddSubdirModal(parent, sub) {
        pendingSubdir = { parent, sub: sub || '' };
        const isLevel2 = !!sub;
        document.getElementById('addSubdirTitle').innerText = isLevel2 ? '➕ 添加二级子目录' : '➕ 添加一级子目录';
        document.getElementById('addSubdirLabel').innerText = isLevel2 ? `在「${parent} / ${sub}」下创建：` : `在「${parent}」下创建：`;
        document.getElementById('addSubdirName').value = '';
        document.getElementById('addSubdirModal').style.display = 'flex';
        setTimeout(() => document.getElementById('addSubdirName').focus(), 50);
    }
    function closeAddSubdirModal() {
        document.getElementById('addSubdirModal').style.display = 'none';
        pendingSubdir = null;
    }
    function confirmAddSubdir() {
        if (!pendingSubdir) return;
        const { parent, sub } = pendingSubdir;
        const name = document.getElementById('addSubdirName').value.trim();
        if (!name) { alert('请输入名称'); return; }
        if (sub) {
            if (getSubSubdirs(parent, sub).includes(name)) { alert('该子目录已存在'); return; }
            const map = loadSubdirs();
            if (!map[parent]) map[parent] = {};
            if (!map[parent][sub]) map[parent][sub] = [];
            map[parent][sub].push(name);
            saveSubdirs(map);
            expandedCats.add(parent);
            expandedSubs.add(parent + '||' + sub);
        } else {
            if (getSubdirs(parent).includes(name)) { alert('该子目录已存在'); return; }
            const map = loadSubdirs();
            if (!map[parent]) map[parent] = {};
            map[parent][name] = map[parent][name] || [];
            saveSubdirs(map);
            expandedCats.add(parent);
        }
        renderCatFilter();
        hideCatMenu();
        closeAddSubdirModal();
    }
    function addSubCategory(parent) { openAddSubdirModal(parent, ''); }
    function addSubSubCategory(parent, sub) { openAddSubdirModal(parent, sub); }
    async function renameSubCategory(parent, oldSub) {
        const newName = prompt('重命名一级子目录：', oldSub);
        if (!newName || !newName.trim() || newName.trim() === oldSub) return;
        const newSub = newName.trim();
        if (getSubdirs(parent).includes(newSub)) { alert('该子目录已存在'); return; }
        const map = loadSubdirs();
        if (map[parent] && map[parent][oldSub] !== undefined) {
            map[parent][newSub] = map[parent][oldSub];
            delete map[parent][oldSub];
            saveSubdirs(map);
        }
        const toUpdate = commands.filter(c => c.category === parent && c.subCategory === oldSub);
        for (const c of toUpdate) { c.subCategory = newSub; await saveCmd(c); }
        if (curCat === parent && curSub === oldSub) curSub = newSub;
        await refresh();
        hideCatMenu();
    }
    async function deleteSubCategory(parent, sub) {
        const n = commands.filter(c => c.category === parent && c.subCategory === sub).length;
        const msg = n > 0 ? `子目录「${sub}」下有 ${n} 条笔记。\n删除后这些笔记将移到「${parent}」下。\n\n确定删除吗？` : `确定删除子目录「${sub}」吗？`;
        if (!confirm(msg)) return;
        const map = loadSubdirs();
        if (map[parent] && map[parent][sub] !== undefined) { delete map[parent][sub]; if (Object.keys(map[parent]).length === 0) delete map[parent]; saveSubdirs(map); }
        const toUpdate = commands.filter(c => c.category === parent && c.subCategory === sub);
        for (const c of toUpdate) { c.subCategory = ''; c.subSubCategory = ''; await saveCmd(c); }
        if (curCat === parent && curSub === sub) { curSub = ''; curSubSub = ''; }
        await refresh();
        hideCatMenu();
    }
    async function renameSubSubCategory(parent, sub, oldSS) {
        const newName = prompt('重命名二级子目录：', oldSS);
        if (!newName || !newName.trim() || newName.trim() === oldSS) return;
        const newSS = newName.trim();
        if (getSubSubdirs(parent, sub).includes(newSS)) { alert('该子目录已存在'); return; }
        const map = loadSubdirs();
        if (map[parent] && map[parent][sub]) {
            const idx = map[parent][sub].indexOf(oldSS);
            if (idx !== -1) map[parent][sub][idx] = newSS;
            saveSubdirs(map);
        }
        const toUpdate = commands.filter(c => c.category === parent && c.subCategory === sub && c.subSubCategory === oldSS);
        for (const c of toUpdate) { c.subSubCategory = newSS; await saveCmd(c); }
        if (curCat === parent && curSub === sub && curSubSub === oldSS) curSubSub = newSS;
        await refresh();
        hideCatMenu();
    }
    async function deleteSubSubCategory(parent, sub, ss) {
        const n = commands.filter(c => c.category === parent && c.subCategory === sub && c.subSubCategory === ss).length;
        const msg = n > 0 ? `二级子目录「${ss}」下有 ${n} 条笔记。\n删除后这些笔记将移到「${parent} / ${sub}」下。\n\n确定删除吗？` : `确定删除二级子目录「${ss}」吗？`;
        if (!confirm(msg)) return;
        const map = loadSubdirs();
        if (map[parent] && map[parent][sub]) { map[parent][sub] = map[parent][sub].filter(x => x !== ss); if (map[parent][sub].length === 0) delete map[parent][sub]; if (Object.keys(map[parent]).length === 0) delete map[parent]; saveSubdirs(map); }
        const toUpdate = commands.filter(c => c.category === parent && c.subCategory === sub && c.subSubCategory === ss);
        for (const c of toUpdate) { c.subSubCategory = ''; await saveCmd(c); }
        if (curCat === parent && curSub === sub && curSubSub === ss) curSubSub = '';
        await refresh();
        hideCatMenu();
    }

    function renderMarkdown(text, showToc = true, prefix = '') {
        if (!text) return '';
        // 先转义HTML防止XSS
        let html = escapeHtml(text);
        // ============ 构建目录 (TOC) ============
        const tocItems = [];
        const headingRegex = /^(#{1,4})\s+(.+)$/gm;
        let m;
        while ((m = headingRegex.exec(escapeHtml(text))) !== null) {
            const level = m[1].length;
            // 清理标题中的 markdown 格式标记，使目录文字干净
            let title = m[2];
            title = title.replace(/`([^`]+)`/g, '$1');        // 行内代码
            title = title.replace(/\*\*([^*]+)\*\*/g, '$1');  // 粗体
            title = title.replace(/\*([^*]+)\*/g, '$1');      // 斜体
            title = title.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1'); // 链接
            const id = prefix + 'md-h-' + tocItems.length;
            tocItems.push({ level, title, id });
        }
        // 保护代码块：提取并替换为占位符
        const codeBlocks = [];
        html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
            const idx = codeBlocks.length;
            const langLabel = (lang || 'code').trim();
            // code 内容已经被外层 escapeHtml 转义过，无需再次转义
            codeBlocks.push(`<div class="md-code-wrapper"><div class="md-code-header"><span class="code-lang">${langLabel}</span><div class="md-code-header-actions"><button class="copy-btn" data-raw="${code.trim().replace(/"/g,'&quot;')}">📋 复制</button><button class="toggle-code-btn md-toggle-btn" onclick="var b=this.parentElement.parentElement.nextElementSibling;if(b.classList.contains('collapsed')){b.classList.remove('collapsed');this.innerText='▲ 收起'}else{b.classList.add('collapsed');this.innerText='▼ 展开'}">▼ 展开</button></div></div><div class="md-code-body collapsed"><pre class="md-code-block"><code>${code.trim()}</code></pre><div class="md-code-expand-hint" onclick="var b=this.parentElement;var btn=b.previousElementSibling?b.previousElementSibling.querySelector('.md-toggle-btn'):null;if(b.classList.contains('collapsed')){b.classList.remove('collapsed');this.title='点击收起';if(btn)btn.innerText='▲ 收起'}else{b.classList.add('collapsed');this.title='点击展开全部';if(btn)btn.innerText='▼ 展开'}" title="点击展开全部">🐾</div></div></div>`);
            return `\x00CODEBLOCK${idx}\x00`;
        });
        // 行内代码 `code`
        html = html.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
        // 粗体 **text**
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        // 斜体 *text*
        html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        // 链接 [text](url)
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        // 标题 (带锚点ID，用于目录跳转)
        let headingIdx = 0;
        html = html.replace(/^(#{1,4})\s+(.+)$/gm, (match, hashes, content) => {
            const level = hashes.length;
            const tag = 'h' + (level + 2); // #→h3, ##→h4, ###→h5, ####→h6
            const id = tocItems[headingIdx] ? tocItems[headingIdx].id : prefix + 'md-h-' + headingIdx;
            headingIdx++;
            return `<${tag} id="${id}">${content}</${tag}>`;
        });
        // 有序列表 (分组连续项)
        html = html.replace(/((?:^\d+\.\s+.+(?:\n|$))+)/gm, (match) => {
            const items = match.trim().split('\n').map(line =>
                `<li>${line.replace(/^\d+\.\s+/, '')}</li>`
            ).join('');
            return `<ol>${items}</ol>`;
        });
        // 无序列表 (分组连续项)
        html = html.replace(/((?:^[-*]\s+.+(?:\n|$))+)/gm, (match) => {
            const items = match.trim().split('\n').map(line =>
                `<li>${line.replace(/^[-*]\s+/, '')}</li>`
            ).join('');
            return `<ul>${items}</ul>`;
        });
        // 表格 (必须在换行转换前处理)
        html = html.replace(/((?:^\|.+\|\s*$[\n\r]*)+)/gm, (match) => {
            const lines = match.trim().split(/\n/).filter(l => l.trim().startsWith('|') && l.trim().endsWith('|'));
            if (lines.length < 2) return match;
            const parseRow = (row) => row.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
            const headerCells = parseRow(lines[0]);
            const sepCells = parseRow(lines[1]);
            const isSep = sepCells.every(c => /^:?-{3,}:?$/.test(c));
            if (!isSep) return match;
            const aligns = sepCells.map(c => {
                if (c.startsWith(':') && c.endsWith(':')) return 'center';
                if (c.endsWith(':')) return 'right';
                return 'left';
            });
            let tableHtml = '<table class="md-table"><thead><tr>';
            headerCells.forEach((cell, i) => { tableHtml += `<th style="text-align:${aligns[i] || 'left'}">${cell}</th>`; });
            tableHtml += '</tr></thead><tbody>';
            for (let i = 2; i < lines.length; i++) {
                const cells = parseRow(lines[i]);
                tableHtml += '<tr>';
                cells.forEach((cell, j) => { tableHtml += `<td style="text-align:${aligns[j] || 'left'}">${cell}</td>`; });
                tableHtml += '</tr>';
            }
            tableHtml += '</tbody></table>';
            return tableHtml;
        });
        // 水平线
        html = html.replace(/^(---|\*\*\*|___)$/gm, '<hr>');
        // 块引用
        html = html.replace(/^&gt;\s?(.+)$/gm, '<blockquote>$1</blockquote>');
        // 换行：非块级元素之间用<br>，保留块级元素
        // 先将已有的换行转为 <br>，但跳过块级标签前后的换行
        html = html.replace(/\n/g, '<br>');
        // 清理块级标签后多余的 <br>
        html = html.replace(/(<\/?(?:h[3-6]|ul|ol|li|pre|hr|blockquote|div|table|thead|tbody|tr|th|td)>)(?:<br>)+/g, '$1');
        html = html.replace(/(?:<br>)+(<\/?(?:h[3-6]|ul|ol|\/li|pre|hr|blockquote|div|table|thead|tbody|tr|th|td)>)/g, '$1');
        // 恢复代码块
        html = html.replace(/\x00CODEBLOCK(\d+)\x00/g, (match, idx) => codeBlocks[parseInt(idx)] || '');
        // ============ 生成TOC HTML（≥2个标题 且 showToc=true 时显示）============
        let tocHtml = '';
        if (tocItems.length >= 2 && showToc) {
            tocHtml = `<!--TOC--><div class="md-toc-wrapper"><div class="md-toc-header" onclick="var l=this.nextElementSibling;var a=this.querySelector('.md-toc-arrow');if(l.style.display==='none'){l.style.display='block';a.textContent='▼'}else{l.style.display='none';a.textContent='▶'}"><span class="md-toc-arrow">▼</span> 📑 目录</div><ul class="md-toc-list" style="display:block">`;
            tocItems.forEach(item => {
                const indent = Math.max(0, (item.level - 1)) * 14;
                tocHtml += `<li class="md-toc-item" style="padding-left:${indent}px"><a href="javascript:void(0)" onclick="var el=document.getElementById('${item.id}');if(el){el.scrollIntoView({behavior:'smooth',block:'start'})}">${item.title}</a></li>`;
            });
            tocHtml += '</ul></div><!--/TOC-->';
        }
        return tocHtml + html;
    }

    async function refresh() { commands = await getAll(); sortAndRender(); }
    async function commit(cmd) { await saveCmd(cmd); await refresh(); }
    async function remove(id) { await delCmd(id); await refresh(); }

    function filterCmds() { return commands.filter(c => { if(curCat !== "全部") { if(c.category !== curCat) return false; if(curSub && (c.subCategory || '') !== curSub) return false; if(curSubSub && (c.subSubCategory || '') !== curSubSub) return false; } if(!curSearch.trim()) return true; const s = curSearch.toLowerCase(); if (c.name.toLowerCase().includes(s) || c.description.toLowerCase().includes(s) || (c.example && c.example.toLowerCase().includes(s))) return true; return (c.codeBlocks || []).some(b => b.name && b.name.toLowerCase().includes(s)); }); }

    // Count commands per category for sidebar badges
    function getCatCounts() {
        const counts = {};
        commands.forEach(c => {
            const cat = c.category || '其他';
            counts[cat] = (counts[cat] || 0) + 1;
        });
        return counts;
    }

    // Count commands per (category, subCategory) for subdirectory badges
    function getSubCounts() {
        const counts = {};
        commands.forEach(c => {
            const cat = c.category || '其他';
            const sub = c.subCategory || '';
            if (!counts[cat]) counts[cat] = {};
            counts[cat][sub] = (counts[cat][sub] || 0) + 1;
        });
        return counts;
    }

    // Count commands per (category, subCategory, subSubCategory) for 二级子目录 badges
    function getSubSubCounts() {
        const counts = {};
        commands.forEach(c => {
            const cat = c.category || '其他';
            const sub = c.subCategory || '';
            const ss = c.subSubCategory || '';
            if (!counts[cat]) counts[cat] = {};
            if (!counts[cat][sub]) counts[cat][sub] = {};
            counts[cat][sub][ss] = (counts[cat][sub][ss] || 0) + 1;
        });
        return counts;
    }

    async function copyText(txt) { await navigator.clipboard.writeText(txt); const t = document.createElement('div'); t.className = 'copy-toast'; t.innerText = '✅ 已复制'; document.body.appendChild(t); setTimeout(() => t.remove(), 1500); }

    function showFullscreen(cmd) {
        currentFsCommand = cmd;
        document.getElementById('fsTitle').innerText = cmd.cardTitle || cmd.name.split('\n')[0].substring(0,80);
        document.getElementById('fsCategory').innerText = cmd.category;
        const highlighted = highlightCode(cmd.name, cmd.codeLang);
        const renderedDesc = renderMarkdown(cmd.description, true, 'fs-');
        // 提取目录 HTML（用 <!--TOC-->...<!--/TOC--> 标记包裹）
        let tocHtml = '';
        let descContent = renderedDesc;
        const tocMatch = renderedDesc.match(/<!--TOC-->([\s\S]*?)<!--\/TOC-->/);
        if (tocMatch) {
            tocHtml = tocMatch[1];
            descContent = renderedDesc.replace(/<!--TOC-->[\s\S]*?<!--\/TOC-->/g, '');
        }
        const descHtml = `<div class="fullscreen-section"><h4>📝 描述 <button class="fullscreen-toggle-btn" id="fsToggleDescBtn">▼ 展开</button></h4><div id="fs-desc-block" class="fullscreen-desc collapsed">${descContent}</div></div>`;
        const codeHtml = `<div class="fullscreen-section"><h4>💻 ${cmd.codeTitle ? escapeHtml(cmd.codeTitle) + ' (' + cmd.codeLang + ')' : '命令内容 (' + cmd.codeLang + ')'}</h4><div class="fullscreen-code-wrapper"><div class="fullscreen-code-header"><span class="code-lang">📄 代码</span><button class="copy-btn fs-copy-btn" data-raw="${escapeHtml(cmd.name).replace(/"/g,'&quot;')}">复制</button><button class="fullscreen-toggle-btn" id="fsToggleCodeBtn">▼ 展开</button></div><div id="fs-code-block" class="fullscreen-code-block collapsed"><pre><code class="hljs">${highlighted}</code></pre></div></div></div>`;
        const extraCodeHtml = (cmd.codeBlocks || []).map((block, idx) => {
            const blockHighlighted = highlightCode(block.name, block.codeLang);
            const blockLabel = block.title || ('代码块 ' + (idx + 2));
            return `<div class="fullscreen-section"><h4>💻 ${escapeHtml(blockLabel)} (${block.codeLang || 'bash'})</h4><div class="fullscreen-code-wrapper"><div class="fullscreen-code-header"><span class="code-lang">📄 代码</span><button class="copy-btn fs-copy-btn" data-raw="${escapeHtml(block.name).replace(/"/g,'&quot;')}">复制</button><button class="fullscreen-toggle-btn" id="fsToggleCodeBtn${idx}">▼ 展开</button></div><div id="fs-code-block-${idx}" class="fullscreen-code-block collapsed"><pre><code class="hljs">${blockHighlighted}</code></pre></div></div></div>`;
        }).join('');
        const exampleHtml = cmd.example ? `<div class="fullscreen-section"><h4>💡 示例 <button class="fullscreen-toggle-btn" id="fsToggleExampleBtn">▼ 展开</button></h4><div id="fs-example-block" class="fullscreen-example collapsed">${escapeHtml(cmd.example).replace(/\n/g,'<br>')}</div></div>` : '';
        const tocSidebar = tocHtml ? `<aside class="fullscreen-toc-sidebar"><div class="fullscreen-toc-title">📑 目录</div><div class="fullscreen-toc-inner">${tocHtml}</div></aside>` : '';
        document.getElementById('fsBody').innerHTML = `<div class="fullscreen-layout"><div class="fullscreen-main">${descHtml + codeHtml + extraCodeHtml + exampleHtml}</div>${tocSidebar}</div>`;

    }

    function renderCards() {
        const filtered = filterCmds();
        const container = document.getElementById('commandsContainer');
        const header = document.getElementById('contentHeader');
        header.textContent = curCat !== '全部' ? (curSub ? (curSubSub ? curCat + ' / ' + curSub + ' / ' + curSubSub : curCat + ' / ' + curSub) : curCat) : '';
        container.classList.toggle('list-view', viewMode === 'list');
        if(filtered.length === 0) { container.innerHTML = '<div class="empty-state">暂无命令，点击新增添加第一条</div>'; return; }
        if (viewMode === 'list') {
            container.innerHTML = filtered.map(cmd => {
                const title = cmd.cardTitle || (cmd.name || '').split('\n')[0].trim();
                const desc = (cmd.description || '')
                    .replace(/```[\s\S]*?```/g, ' ')
                    .replace(/[#>*`_~\[\]()]/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim();
                return `<div class="list-item" data-cmd-id="${cmd.id}">
                    <span class="list-item-icon"><i class="bi bi-terminal"></i></span>
                    <div class="list-item-main">
                        <h3 class="list-title">${escapeHtml(title)}</h3>
                        ${desc ? `<p class="list-desc">${escapeHtml(desc)}</p>` : ''}
                        <div class="list-meta">
                            <span class="category-tag">${escapeHtml(cmd.category)}</span>
                            <span class="list-lang">${escapeHtml(cmd.codeLang || 'bash')}</span>
                            <span class="list-more">查看 <i class="bi bi-arrow-right"></i></span>
                        </div>
                    </div>
                </div>`;
            }).join('');
            document.querySelectorAll('.list-item').forEach(item => item.addEventListener('click', e => {
                e.stopPropagation();
                const cmd = commands.find(c => c.id === item.dataset.cmdId);
                if (cmd) showFullscreen(cmd);
            }));
            return;
        }
        container.innerHTML = filtered.map(cmd => {
            const highlighted = highlightCode(cmd.name, cmd.codeLang);
            const shortTitle = cmd.name.split('\n')[0].substring(0,50);
            const cardTitle = cmd.cardTitle || shortTitle;
            // 预计算主代码块头部 HTML，避免嵌套模板字符串
            const primaryHeaderHtml = cmd.codeTitle
                ? ('<span class="code-block-title">' + escapeHtml(cmd.codeTitle) + '</span><span class="code-lang-badge">' + cmd.codeLang + '</span>')
                : ('<span class="code-lang">' + cmd.codeLang + '</span>');
            return `<div class="command-card" data-cmd-id="${cmd.id}">
                <div class="card-header"><span class="command-title"><span class="command-title-inner">${escapeHtml(cardTitle)}</span></span><span class="category-tag">${escapeHtml(cmd.category)}</span></div>
                <div class="command-body">
                    <div class="desc-toggle-header">
                        <span>📝 描述</span>
                        <button class="toggle-desc-btn" data-target="desc-${cmd.id}">展开</button>
                    </div>
                    <div id="desc-${cmd.id}" class="command-desc collapsed">${renderMarkdown(cmd.description, false, 'card-')}</div>
                    <div class="code-wrapper">
                        <div class="code-header">${primaryHeaderHtml}<button class="copy-btn" data-target="code-${cmd.id}">复制</button><button class="toggle-code-btn" data-target="code-${cmd.id}">展开</button></div>
                        <div id="code-${cmd.id}" class="code-block collapsed" data-raw="${escapeHtml(cmd.name).replace(/"/g,'&quot;')}">
                            <pre><code class="hljs">${highlighted}</code></pre>
                        </div>
                    </div>
                    ${(cmd.codeBlocks || []).map((block, idx) => {
                        const blockHighlighted = highlightCode(block.name, block.codeLang);
                        const blockTitle = block.title || '';
                        const blockHeaderHtml = blockTitle
                            ? ('<span class="code-block-title">' + escapeHtml(blockTitle) + '</span><span class="code-lang-badge">' + escapeHtml(block.codeLang || 'bash') + '</span>')
                            : ('<span class="code-lang">' + escapeHtml(block.codeLang || 'bash') + '<span class="extra-code-label">代码块' + (idx + 2) + '</span></span>');
                        return `<div class="code-wrapper">
                            <div class="code-header">${blockHeaderHtml}<button class="copy-btn" data-target="code-${cmd.id}-${idx}">复制</button><button class="toggle-code-btn" data-target="code-${cmd.id}-${idx}">展开</button></div>
                            <div id="code-${cmd.id}-${idx}" class="code-block collapsed" data-raw="${escapeHtml(block.name).replace(/"/g,'&quot;')}">
                                <pre><code class="hljs">${blockHighlighted}</code></pre>
                            </div>
                        </div>`;
                    }).join('')}
                    ${cmd.example ? `
                    <div class="example-toggle-header">
                        <span>💡 示例</span>
                        <button class="toggle-example-btn" data-target="example-${cmd.id}">展开</button>
                    </div>
                    <div id="example-${cmd.id}" class="example example-block collapsed">${escapeHtml(cmd.example).replace(/\n/g,'<br>')}</div>` : ''}
                    <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:0.62rem; color: var(--text-secondary);">右键全屏浏览</span>
                        <div><button class="edit-cmd-btn btn btn-sm" data-id="${cmd.id}">编辑</button>
                        <button class="delete-cmd-btn btn btn-sm" data-id="${cmd.id}" style="border-color:#ef4444; color:#ef4444;">删除</button></div>
                    </div>
                </div>
            </div>`;
        }).join('');

        document.querySelectorAll('.command-title').forEach(el => { const inner = el.querySelector('.command-title-inner'); if(inner && inner.scrollWidth > el.clientWidth) el.classList.add('overflow'); });
        document.querySelectorAll('.toggle-code-btn').forEach(btn => btn.addEventListener('click', e => { const targetId = btn.dataset.target; const block = document.getElementById(targetId); if(block) { if(block.classList.contains('collapsed')) { block.classList.remove('collapsed'); block.classList.add('expanded'); btn.innerText = '收起'; btn.classList.add('expanded'); } else { block.classList.remove('expanded'); block.classList.add('collapsed'); btn.innerText = '展开'; btn.classList.remove('expanded'); } } e.stopPropagation(); }));
        document.querySelectorAll('.toggle-desc-btn').forEach(btn => btn.addEventListener('click', e => { const targetId = btn.dataset.target; const block = document.getElementById(targetId); if(block) { if(block.classList.contains('collapsed')) { block.classList.remove('collapsed'); btn.innerText = '收起'; } else { block.classList.add('collapsed'); btn.innerText = '展开'; } } e.stopPropagation(); }));
        document.querySelectorAll('.toggle-example-btn').forEach(btn => btn.addEventListener('click', e => { const targetId = btn.dataset.target; const block = document.getElementById(targetId); if(block) { if(block.classList.contains('collapsed')) { block.classList.remove('collapsed'); btn.innerText = '收起'; } else { block.classList.add('collapsed'); btn.innerText = '展开'; } } e.stopPropagation(); }));
        document.querySelectorAll('.copy-btn').forEach(btn => btn.addEventListener('click', async e => { e.stopPropagation(); let raw; const target = document.getElementById(btn.dataset.target); if(target) { raw = target.dataset.raw; } else if(btn.dataset.raw) { raw = btn.dataset.raw; } if(raw) { raw = raw.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'); await copyText(raw); } }));
        document.querySelectorAll('.command-card').forEach(card => card.addEventListener('contextmenu', async e => { e.preventDefault(); const id = card.querySelector('.edit-cmd-btn')?.dataset.id; if(id) { const cmd = commands.find(c => c.id === id); if(cmd) showFullscreen(cmd); } return false; }));
        document.querySelectorAll('.edit-cmd-btn').forEach(btn => btn.addEventListener('click', async e => { const id = btn.dataset.id; const c = commands.find(cmd => cmd.id === id); if(c) openEdit(c); e.stopPropagation(); }));
        document.querySelectorAll('.delete-cmd-btn').forEach(btn => btn.addEventListener('click', async e => { if(confirm('永久删除？')) { await remove(btn.dataset.id); refreshCats(); renderCatFilter(); updateCatSelect(); } e.stopPropagation(); }));
    }

    function renderCatFilter() {
        const allCatsList = getCatList();
        const counts = getCatCounts();
        const subCounts = getSubCounts();
        const subSubCounts = getSubSubCounts();
        const total = commands.length;
        const div = document.getElementById('categoryFilter');
        const searchQ = catSearch.trim();
        const catIndex = {};
        allCatsList.forEach((c, i) => catIndex[c] = i);
        const cats = allCatsList.filter(c => {
            if (!searchQ) return true;
            if (fuzzyMatch(catSearch, c)) return true;
            return getSubdirs(c).some(s => fuzzyMatch(catSearch, s) || getSubSubdirs(c, s).some(ss => fuzzyMatch(catSearch, ss)));
        });
        let html = `<div class="sticky-all-wrapper"><button class="category-item ${curCat==='全部'?'active':''}" data-cat="全部">
            <span class="cat-arrow"></span><span class="cat-icon"><i class="bi bi-grid"></i></span><span>全部</span><span class="cat-count">${total}</span>
        </button></div>`;
        if (searchQ && cats.length === 0) {
            html += `<div class="sidebar-search-empty"><i class="bi bi-search"></i> 未找到匹配目录</div>`;
        }
        cats.forEach((c) => {
            const subdirs = getSubdirs(c);
            const count = counts[c] || 0;
            const icon = getCatIcon(c, catIndex[c] || 0);
            const hasChildren = subdirs.length > 0;
            const isActive = (curCat === c && !curSub);
            const expanded = searchQ ? true : expandedCats.has(c);
            html += `<div class="category-item-wrapper" data-cat="${escapeHtml(c)}">
                <button class="category-item ${isActive?'active':''} ${hasChildren?'has-children':''}" data-cat="${escapeHtml(c)}">
                    <span class="cat-arrow${hasChildren && expanded ? ' expanded' : ''}">${hasChildren ? (expanded ? '▾' : '▸') : ''}</span>
                    <span class="cat-icon"><i class="bi ${escapeHtml(icon)}"></i></span>
                    <span class="cat-name-text">${fuzzyHighlight(c, catSearch)}</span>
                    <span class="cat-count">${count}</span>
                </button>
                <button class="cat-more-btn" data-cat="${escapeHtml(c)}" data-sub="" data-subsub="" title="更多操作">⋮</button>
            </div>`;
            if (hasChildren && expanded) {
                let shownSubs = subdirs;
                if (searchQ && !fuzzyMatch(catSearch, c)) {
                    shownSubs = subdirs.filter(s => fuzzyMatch(catSearch, s) || getSubSubdirs(c, s).some(ss => fuzzyMatch(catSearch, ss)));
                }
                html += `<div class="subcat-list">`;
                shownSubs.forEach(s => {
                    const subSubs = getSubSubdirs(c, s);
                    const scount = (subCounts[c] && subCounts[c][s]) || 0;
                    const subHasChildren = subSubs.length > 0;
                    const subActive = (curCat === c && curSub === s && !curSubSub);
                    const subExpanded = searchQ ? true : expandedSubs.has(c + '||' + s);
                    html += `<div class="category-item-wrapper" data-cat="${escapeHtml(c)}" data-sub="${escapeHtml(s)}">
                        <button class="category-item subcat-item ${subActive?'active':''} ${subHasChildren?'has-children':''}" data-cat="${escapeHtml(c)}" data-sub="${escapeHtml(s)}">
                            <span class="cat-arrow${subHasChildren && subExpanded ? ' expanded' : ''}">${subHasChildren ? (subExpanded ? '▾' : '▸') : ''}</span>
                            <span class="cat-icon"><i class="bi bi-folder2-open"></i></span>
                            <span class="cat-name-text">${fuzzyHighlight(s, catSearch)}</span>
                            <span class="cat-count">${scount}</span>
                        </button>
                        <button class="cat-more-btn" data-cat="${escapeHtml(c)}" data-sub="${escapeHtml(s)}" data-subsub="" title="更多操作">⋮</button>
                    </div>`;
                    if (subHasChildren && subExpanded) {
                        let shownSS = subSubs;
                        if (searchQ && !fuzzyMatch(catSearch, s) && !fuzzyMatch(catSearch, c)) {
                            shownSS = subSubs.filter(ss => fuzzyMatch(catSearch, ss));
                        }
                        html += `<div class="subcat-list">`;
                        shownSS.forEach(ss => {
                            const sscount = (subSubCounts[c] && subSubCounts[c][s] && subSubCounts[c][s][ss]) || 0;
                            const ssActive = (curCat === c && curSub === s && curSubSub === ss);
                            html += `<div class="category-item-wrapper" data-cat="${escapeHtml(c)}" data-sub="${escapeHtml(s)}" data-subsub="${escapeHtml(ss)}">
                                <button class="category-item subcat-item subsubcat-item ${ssActive?'active':''}" data-cat="${escapeHtml(c)}" data-sub="${escapeHtml(s)}" data-subsub="${escapeHtml(ss)}">
                                    <span class="cat-arrow"></span>
                                    <span class="cat-icon"><i class="bi bi-file-earmark"></i></span>
                                    <span class="cat-name-text">${fuzzyHighlight(ss, catSearch)}</span>
                                    <span class="cat-count">${sscount}</span>
                                </button>
                                <button class="cat-more-btn" data-cat="${escapeHtml(c)}" data-sub="${escapeHtml(s)}" data-subsub="${escapeHtml(ss)}" title="更多操作">⋮</button>
                            </div>`;
                        });
                        html += `</div>`;
                    }
                });
                html += `</div>`;
            }
        });
        div.innerHTML = html;

        // Click on category item to filter / toggle expand
        document.querySelectorAll('.category-item').forEach(btn => btn.addEventListener('click', e => {
            const cat = btn.dataset.cat;
            const sub = btn.dataset.sub || '';
            const subsub = btn.dataset.subsub || '';
            const isTop = btn.dataset.sub === undefined;
            const isSub = btn.dataset.sub !== undefined && btn.dataset.subsub === undefined;
            if (e.target.closest('.cat-arrow')) {
                if (isTop && getSubdirs(cat).length > 0) {
                    if (expandedCats.has(cat)) expandedCats.delete(cat); else expandedCats.add(cat);
                    renderCatFilter();
                    return;
                }
                if (isSub && getSubSubdirs(cat, sub).length > 0) {
                    const key = cat + '||' + sub;
                    if (expandedSubs.has(key)) expandedSubs.delete(key); else expandedSubs.add(key);
                    renderCatFilter();
                    return;
                }
            }
            curCat = cat;
            curSub = sub;
            curSubSub = subsub;
            if (sub) expandedCats.add(cat);
            if (subsub) expandedSubs.add(cat + '||' + sub);
            renderCatFilter();
            renderCards();
            if (window.innerWidth <= 768) closeSidebar();
            hideCatMenu();
        }));

        // Click on ⋮ button to show action menu
        document.querySelectorAll('.cat-more-btn').forEach(btn => btn.addEventListener('click', e => {
            e.stopPropagation();
            e.preventDefault();
            showCatMenu(btn, btn.dataset.cat, btn.dataset.sub || '', btn.dataset.subsub || '');
        }));
    }

    function renderSubSelect(selId, parentCat, selectedSub) {
        const sel = document.getElementById(selId);
        if (!sel) return;
        const subs = getSubdirs(parentCat);
        let html = `<option value="">（无子目录）</option>`;
        subs.forEach(s => { html += `<option value="${escapeHtml(s)}" ${s === selectedSub ? 'selected' : ''}>${escapeHtml(s)}</option>`; });
        sel.innerHTML = html;
        sel.value = (selectedSub && subs.includes(selectedSub)) ? selectedSub : '';
    }
    function renderSubSubSelect(selId, parentCat, parentSub, selectedSS) {
        const sel = document.getElementById(selId);
        if (!sel) return;
        const subs = getSubSubdirs(parentCat, parentSub);
        let html = `<option value="">（无子目录）</option>`;
        subs.forEach(s => { html += `<option value="${escapeHtml(s)}" ${s === selectedSS ? 'selected' : ''}>${escapeHtml(s)}</option>`; });
        sel.innerHTML = html;
        sel.value = (selectedSS && subs.includes(selectedSS)) ? selectedSS : '';
    }
    function updateSubCatSelect(parentCat, selectedSub) { renderSubSelect('cmdSubCategory', parentCat, selectedSub); }
    function updateSubSubCatSelect(parentCat, parentSub, selectedSS) { renderSubSubSelect('cmdSubSubCategory', parentCat, parentSub, selectedSS); }
    function updateCatSelect() {
        const sel = document.getElementById('cmdCategory');
        const cats = getCatList();
        sel.innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
        if(cats.length === 0) sel.innerHTML = '<option>其他</option>';
        updateSubCatSelect(sel.value || '', '');
        updateSubSubCatSelect(sel.value || '', '', '');
    }

    async function sortAndRender() { refreshCats(); renderCatFilter(); updateCatSelect(); renderCards(); }

    function openEdit(cmd) {
        updateCatSelect();
        document.getElementById('cmdName').value = cmd.name;
        document.getElementById('cmdCategory').value = cmd.category;
        document.getElementById('cmdDesc').value = cmd.description;
        document.getElementById('cmdExample').value = cmd.example || '';
        document.getElementById('editId').value = cmd.id;
        const langSelect = document.getElementById('cmdLang');
        if(langSelect) langSelect.value = cmd.codeLang || 'bash';
        // 使用全屏模式编辑
        showFullscreenEdit(cmd);
    }

    function showFullscreenEdit(cmd) {
        currentFsCommand = cmd;
        document.getElementById('fsTitle').innerText = '编辑: ' + (cmd.cardTitle || cmd.name.split('\n')[0].substring(0,60));
        document.getElementById('fsCategory').innerText = cmd.category;
        const catOpts = getCatList().map(c => `<option value="${escapeHtml(c)}" ${c===cmd.category?'selected':''}>${escapeHtml(c)}</option>`).join('');
        const subCatOpts = `<option value="">（无子目录）</option>` + getSubdirs(cmd.category).map(s => `<option value="${escapeHtml(s)}" ${s===cmd.subCategory?'selected':''}>${escapeHtml(s)}</option>`).join('');
        const subSubCatOpts = `<option value="">（无子目录）</option>` + getSubSubdirs(cmd.category, cmd.subCategory).map(s => `<option value="${escapeHtml(s)}" ${s===cmd.subSubCategory?'selected':''}>${escapeHtml(s)}</option>`).join('');
        const body = `
            <div class="fullscreen-section">
                <h4>📌 卡片标题</h4>
                <input type="text" id="fsEditCardTitle" placeholder="留空则默认显示代码第一行" value="${escapeHtml(cmd.cardTitle || '')}" style="width:100%;padding:0.5rem 0.7rem;border-radius:12px;border:1px solid var(--border-light);background:var(--search-bg);color:var(--text-primary);font-size:0.85rem;">
            </div>
            <div class="fullscreen-section">
                <h4>💻 命令内容 (${cmd.codeLang})</h4>
                <input type="text" id="fsEditCodeTitle" placeholder="脚本名称（可选，显示在代码框头部）" value="${escapeHtml(cmd.codeTitle || '')}" style="width:100%;padding:0.45rem 0.7rem;margin-bottom:8px;border-radius:10px;border:1px solid var(--border-light);background:var(--search-bg);color:var(--text-primary);font-size:0.82rem;">
                <textarea id="fsEditName" style="width:100%;min-height:260px;padding:1rem;border-radius:16px;border:1px solid var(--border-light);background:var(--code-bg);color:var(--code-text);font-family:monospace;font-size:0.85rem;line-height:1.5;resize:vertical;white-space:pre;overflow:auto;">${escapeHtml(cmd.name)}</textarea>
            </div>
            <div class="fullscreen-section">
                <h4>🏷️ 分类 & 语言</h4>
                <div style="display:flex;gap:1rem;flex-wrap:wrap;">
                    <div style="flex:1;min-width:140px;">
                        <label style="font-size:0.75rem;color:var(--text-secondary);">分类</label>
                        <select id="fsEditCategory" style="width:100%;padding:0.5rem;border-radius:12px;border:1px solid var(--border-light);background:var(--search-bg);color:var(--text-primary);">${catOpts}</select>
                    </div>
                    <div style="flex:1;min-width:140px;">
                        <label style="font-size:0.75rem;color:var(--text-secondary);">一级子目录（可选）</label>
                        <select id="fsEditSubCategory" style="width:100%;padding:0.5rem;border-radius:12px;border:1px solid var(--border-light);background:var(--search-bg);color:var(--text-primary);">${subCatOpts}</select>
                    </div>
                    <div style="flex:1;min-width:140px;">
                        <label style="font-size:0.75rem;color:var(--text-secondary);">二级子目录（可选）</label>
                        <select id="fsEditSubSubCategory" style="width:100%;padding:0.5rem;border-radius:12px;border:1px solid var(--border-light);background:var(--search-bg);color:var(--text-primary);">${subSubCatOpts}</select>
                    </div>
                    <div style="flex:1;min-width:140px;">
                        <label style="font-size:0.75rem;color:var(--text-secondary);">代码语言</label>
                        <select id="fsEditLang" style="width:100%;padding:0.5rem;border-radius:12px;border:1px solid var(--border-light);background:var(--search-bg);color:var(--text-primary);">
                            ${['bash','python','cpp','javascript','typescript','yaml','json','go','rust','java','csharp','php','sql','html','css','plaintext'].map(l => `<option value="${l}" ${l===cmd.codeLang?'selected':''}>${l}</option>`).join('')}
                        </select>
                    </div>
                </div>
            </div>
            <div class="fullscreen-section">
                <h4>📝 描述</h4>
                <textarea id="fsEditDesc" rows="2" style="width:100%;padding:0.7rem;border-radius:14px;border:1px solid var(--border-light);background:var(--search-bg);color:var(--text-primary);font-size:0.88rem;resize:vertical;">${escapeHtml(cmd.description)}</textarea>
            </div>
            <div class="fullscreen-section">
                <h4>💡 示例</h4>
                <textarea id="fsEditExample" rows="3" style="width:100%;padding:0.7rem;border-radius:14px;border:1px solid var(--border-light);background:var(--search-bg);color:var(--text-primary);font-size:0.88rem;resize:vertical;">${escapeHtml(cmd.example || '')}</textarea>

            <div class="fullscreen-section">
                <h4>📦 额外代码块 <span style="font-weight:400;font-size:0.78rem;color:var(--text-secondary);">（可选）</span></h4>

        document.getElementById('fsAddCodeBlockBtn').addEventListener('click', () => {
            document.getElementById('fsExtraCodeBlocksContainer').appendChild(createCodeBlockItem());
        });
        document.getElementById('fullscreenModal').style.display = 'block';
        document.body.style.overflow = 'hidden';
        // 切换底部按钮
        document.getElementById('fsCopyBtn').style.display = 'none';
        document.getElementById('fsEditBtn').innerText = '保存';
        document.getElementById('fsEditBtn').onclick = saveFullscreenEdit;
    }

    async function saveFullscreenEdit() {
        const id = currentFsCommand.id;
        const name = document.getElementById('fsEditName').value;
        if (!name.trim()) { showToast('命令不能为空', false); return; }
        const category = document.getElementById('fsEditCategory').value;
        const subCategory = document.getElementById('fsEditSubCategory').value || '';
        const subSubCategory = document.getElementById('fsEditSubSubCategory').value || '';
        const codeLang = document.getElementById('fsEditLang').value;
        const cardTitle = document.getElementById('fsEditCardTitle').value.trim();
        const codeTitle = document.getElementById('fsEditCodeTitle').value.trim();
        const description = document.getElementById('fsEditDesc').value.trim();
        const example = document.getElementById('fsEditExample').value.trim();
        const codeBlocks = collectFormCodeBlocks('fsExtraCodeBlocksContainer');
        const cmd = { id, name, category, subCategory, subSubCategory, description, example, codeLang, cardTitle, codeTitle, codeBlocks };
        try {
            await commit(cmd);
            showToast('保存成功', true);
            closeFullscreen();
        } catch(e) {
            showToast('保存失败: ' + e.message, false);
        }
    }

    function showToast(msg, success) {
        const t = document.createElement('div');
        t.className = 'copy-toast';
        t.innerText = (success ? '✓ ' : '✗ ') + msg;
        t.style.background = success ? 'linear-gradient(135deg, #10b981, #059669)' : 'linear-gradient(135deg, #ef4444, #dc2626)';
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
    }

    function resetModal() {
        document.getElementById('cmdName').value = '';
        updateCatSelect();
        const def = getCatList()[0] || '其他';
        document.getElementById('cmdCategory').value = def;
        updateSubCatSelect(def, '');
        updateSubSubCatSelect(def, '', '');
        document.getElementById('cmdDesc').value = '';
        document.getElementById('cmdExample').value = '';
        document.getElementById('editId').value = '';
        const langSelect = document.getElementById('cmdLang');
