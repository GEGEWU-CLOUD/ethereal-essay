    // 气泡特效
    let bubbleRunning = false, bubbleTimer = null;
    function startBubbles() {
        if (bubbleRunning) return;
        bubbleRunning = true;
        if (typeof $ !== 'undefined' && $.fn && $.fn.circlemagic) {
            try { $('body').circlemagic({ color: ['rgba(173,216,230,0.6)','rgba(135,206,250,0.5)','rgba(176,224,250,0.5)'], radius: [8,30], density: 0.5, speed: [0.15,0.6], zIndex: 99996 }); }
            catch(e) { startBubbleFallback(); }
        } else { startBubbleFallback(); }
    }
    function stopBubbles() {
        bubbleRunning = false;
        if (bubbleTimer) { clearInterval(bubbleTimer); bubbleTimer = null; }
        var old = document.getElementById('bubbleCanvas');
        if (old) old.remove();
    }
    function startBubbleFallback() {
        if (!bubbleRunning) return;
        var c = document.getElementById('bubbleCanvas');
        if (!c) {
            c = document.createElement('canvas');
            c.id = 'bubbleCanvas';
            c.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:99996;pointer-events:none';
            document.body.appendChild(c);
        }
        var ctx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        var bubbles = [];
        for (var i = 0; i < 15; i++) {
            bubbles.push({ x: Math.random()*c.width, y: c.height+Math.random()*200, r: Math.random()*18+6, speed: Math.random()*0.8+0.3, ox: Math.random()*50 });
        }
        function frame() {
            if (!bubbleRunning) { ctx.clearRect(0,0,c.width,c.height); return; }
            ctx.clearRect(0, 0, c.width, c.height);
            for (var i = 0; i < bubbles.length; i++) {
                var b = bubbles[i];
                ctx.beginPath();
                ctx.arc(b.x + Math.sin(b.y*0.02)*b.ox, b.y, b.r, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(200,225,245,0.25)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(180,210,240,0.35)';
                ctx.lineWidth = 1;
                ctx.stroke();
                // 高光
                ctx.beginPath();
                ctx.arc(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.25, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,255,255,0.45)';
                ctx.fill();
                b.y -= b.speed;
                if (b.y < -30) { b.y = c.height + 30; b.x = Math.random()*c.width; }
            }
            bubbleTimer = requestAnimationFrame(frame);
        }
        frame();
    }

    // 滑块值(10-95) → CSS alpha(0.10-0.95)，值越大越不透明
    function sliderToAlpha(val) { return (val / 100).toFixed(2); }

    function getStoredOpacity() {
        const v = localStorage.getItem('bg_opacity');
        return v ? parseInt(v) : 92; // 默认92
    }

    function applyMainAlpha(alpha) {
        document.documentElement.style.setProperty('--main-alpha', alpha);
        // 透明度<0.65时自动增强文字对比度
        const glow = alpha < 0.65 ? (0.65 - alpha) * 1.5 : 0;
        document.documentElement.style.setProperty('--text-glow', glow);
        if (glow > 0) {
            document.documentElement.style.setProperty('--text-shadow', document.body.classList.contains('dark-mode')
                ? `0 0 ${glow*8}px rgba(255,255,255,${glow})` : `0 0 ${glow*6}px rgba(0,0,0,${glow*0.5})`);
        } else {
            document.documentElement.style.setProperty('--text-shadow', 'none');
        }
    }

    function applyBgImage(url) {
        const layer = document.getElementById('bgImageLayer');
        if (url) {
            // 图片 + 深蓝渐变兜底：图片加载前显示深蓝渐变（避免灰色），加载后图片覆盖渐变
            layer.style.backgroundImage = `url('${url}'), linear-gradient(160deg, #16325f 0%, #2c4a7c 40%, #4a5fa8 72%, #6b7fd4 100%)`;
            layer.style.display = 'block';
            document.body.classList.add('has-bg-image');
            // 让body背景半透，露出图片
            document.body.style.background = document.body.classList.contains('dark-mode')
                ? 'rgba(15,23,42,0.85)' : 'rgba(227,237,247,0.7)';
            const alpha = sliderToAlpha(getStoredOpacity());
            applyMainAlpha(alpha);
            document.getElementById('bgImageBtn').innerHTML = '<i class="bi bi-image-fill"></i>';
            document.getElementById('bgImageBtn').style.background = 'linear-gradient(135deg, #dbeafe, #ede9fe)';
        } else {
            layer.style.backgroundImage = '';
            layer.style.display = 'none';
            document.body.classList.remove('has-bg-image');
            document.body.style.background = '';
            applyMainAlpha(1);
            document.getElementById('bgImageBtn').innerHTML = '<i class="bi bi-image"></i>';
            document.getElementById('bgImageBtn').style.background = '';
        }
    }

        const rect = btn.getBoundingClientRect();
        menu.style.top = rect.bottom + 4 + 'px';
        menu.style.left = Math.min(rect.left, window.innerWidth - 150) + 'px';
        menu.classList.add('show');
    }

    function hideCatMenu() {
        const menu = document.getElementById('catActionMenu');
        menu.classList.remove('show');
        currentCatMenuTarget = null;
        currentCatMenuSub = '';
        currentCatMenuSubSub = '';
    }

    // ==================== EDIT CATEGORY MODAL ====================
    function openEditCatModal(catName) {
        hideCatMenu();
        document.getElementById('editCatName').value = catName;
        document.getElementById('editCatOldName').value = catName;
        const currentIcon = getCatIcon(catName, 0);
        document.getElementById('editCatIcon').value = currentIcon;
        renderIconPicker('editCatIconPicker', 'editCatIcon', currentIcon);
        document.getElementById('editCategoryModal').style.display = 'flex';
    }
    function closeEditCatModal() { document.getElementById('editCategoryModal').style.display = 'none'; }

    async function saveEditCategory() {
        const oldName = document.getElementById('editCatOldName').value;
        const newName = document.getElementById('editCatName').value.trim();
        const newIcon = document.getElementById('editCatIcon').value;
        if (!newName) return alert('分类名称不能为空');
        if (newName !== oldName && allCats.has(newName)) return alert('该分类名称已存在');
        // Save icon
        saveCatIcon(newName, newIcon);
        if (newName !== oldName) {
            // Remove old icon mapping
            saveCatIcon(oldName, null);
            // 移动子目录映射
            const map = loadSubdirs();
            if (map[oldName]) { map[newName] = map[oldName]; delete map[oldName]; saveSubdirs(map); }
            // Update all commands
            const toUpdate = commands.filter(c => c.category === oldName);
            for (const cmd of toUpdate) { cmd.category = newName; await saveCmd(cmd); }
            if (curCat === oldName) curCat = newName;
        }
        await refresh();
        closeEditCatModal();
    }

    async function deleteCategory(catName) {
        const cmdsInCat = commands.filter(c => c.category === catName);
        const msg = cmdsInCat.length > 0
            ? `分类「${catName}」下有 ${cmdsInCat.length} 条命令。\n\n确定要删除此分类吗？\n命令将移至「其他」分类。`
            : `确定要删除分类「${catName}」吗？`;
        if (!confirm(msg)) return;
        // Reassign all commands in this category to 其他
        for (const cmd of cmdsInCat) {
            cmd.category = '其他';
            cmd.subCategory = '';
            cmd.subSubCategory = '';
            await saveCmd(cmd);
        }
        // 移除该分类下的子目录结构
        const map = loadSubdirs();
        if (map[catName]) { delete map[catName]; saveSubdirs(map); }
        // If current filter was on deleted category, reset to all
        if (curCat === catName) { curCat = '全部'; curSub = ''; curSubSub = ''; }
        await refresh();
        hideCatMenu();
    }

    // ==================== SIDEBAR MOBILE TOGGLE ====================
    function openSidebar() {
        document.getElementById('sidebar').classList.add('open');
        document.getElementById('sidebarOverlay').classList.add('show');
        document.body.style.overflow = 'hidden';
    }
    function closeSidebar() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('show');
        document.body.style.overflow = '';
    }
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (sidebar.classList.contains('open')) closeSidebar();
        else openSidebar();
    }

    // ==================== SIDEBAR RESIZE ====================
    function initSidebarResize() {
        const sidebar = document.getElementById('sidebar');
        const handle = document.getElementById('sidebarResizeHandle');
        const mainContent = document.querySelector('.main-content');
        if (!sidebar || !handle) return;
        let isDragging = false, startX, startWidth;
        const MIN_W = 180, MAX_W = 500;
        // 恢复保存的宽度
        const savedW = localStorage.getItem('sidebar_width');
        if (savedW) {
            const w = Math.max(MIN_W, Math.min(MAX_W, parseInt(savedW)));
            document.documentElement.style.setProperty('--sidebar-width', w + 'px');
        }
        handle.addEventListener('mousedown', e => {
            e.preventDefault();
            e.stopPropagation();
            isDragging = true;
            startX = e.clientX;
            startWidth = sidebar.offsetWidth;
            handle.classList.add('dragging');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });
        document.addEventListener('mousemove', e => {
            if (!isDragging) return;
            const delta = e.clientX - startX;
            const newW = Math.max(MIN_W, Math.min(MAX_W, startWidth + delta));
            document.documentElement.style.setProperty('--sidebar-width', newW + 'px');
        });
        document.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            handle.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            const w = sidebar.offsetWidth;
            localStorage.setItem('sidebar_width', w);
        });
    }

    // ==================== SYNC PANEL TOGGLE ====================
    function openGistDrawer() {
        document.getElementById('gistDrawer').classList.add('open');
        document.getElementById('gistDrawerOverlay').classList.add('show');
        const syncHeader = document.getElementById('sidebarSyncToggle');
        if (syncHeader) syncHeader.classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function closeGistDrawer() {
        document.getElementById('gistDrawer').classList.remove('open');
        document.getElementById('gistDrawerOverlay').classList.remove('show');
        const syncHeader = document.getElementById('sidebarSyncToggle');
        if (syncHeader) syncHeader.classList.remove('open');
        document.body.style.overflow = '';
    }
    function toggleGistDrawer() {
        if (document.getElementById('gistDrawer').classList.contains('open')) {
            closeGistDrawer();
        } else {
            openGistDrawer();
        }
    }

    async function init() {
        initTheme();
        updateHeroState();
        initBgImage();
        window.addEventListener('scroll', updateHeroState, { passive: true });
        const heroHint = document.getElementById('heroScrollHint');
        if (heroHint) heroHint.addEventListener('click', () => window.scrollTo({ top: window.innerHeight, behavior: 'smooth' }));
        document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
        const viewToggleBtn = document.getElementById('viewToggleBtn');
        if (viewToggleBtn) viewToggleBtn.addEventListener('click', toggleViewMode);
        updateViewToggleBtn();

        // ==================== 滚动锁定（保持在内容区） ====================
        const scrollLockBtn = document.getElementById('scrollLockBtn');
        const scrollLockIcon = document.getElementById('scrollLockIcon');
        let scrollLock = false;
        let scrollLockAnimating = false;
        let scrollLockAnimTimer = null;
        function updateScrollLockBtn() {
            if (!scrollLockBtn) return;
            scrollLockBtn.classList.toggle('active', scrollLock);
            scrollLockBtn.title = scrollLock ? '已锁定滚动：松开可返回首屏' : '锁定滚动：保持在内容区';
            if (scrollLockIcon) scrollLockIcon.className = scrollLock ? 'bi bi-pin-angle-fill' : 'bi bi-pin-angle';
        }
        // 硬性兜底：无论何种滚动来源（滚轮、触控板惯性、键盘、拖动滚动条），
        // 只要滚进了首屏区域，立即拉回内容区顶部，避免“滑上去又弹回”的抖动。
        function enforceScrollLock() {
            if (!scrollLock || scrollLockAnimating) return;
            if (window.scrollY < window.innerHeight) {
                window.scrollTo(0, window.innerHeight);
            }
        }
        if (scrollLockBtn) {
            scrollLockBtn.addEventListener('click', () => {
                scrollLock = !scrollLock;
                updateScrollLockBtn();
                // 开启锁定时若仍在首屏，先滚动到内容区（平滑过渡期间暂停兜底，避免被拉回）
                if (scrollLock && window.scrollY < window.innerHeight) {
                    scrollLockAnimating = true;
                    window.scrollTo({ top: window.innerHeight, behavior: 'smooth' });
                    clearTimeout(scrollLockAnimTimer);
                    scrollLockAnimTimer = setTimeout(() => { scrollLockAnimating = false; }, 700);
                }
                showToast(scrollLock ? '已锁定滚动：内容区固定' : '已解锁滚动', true);
            });
        }
        // 滚轮拦截：锁定后，向上滚动不会回到首屏，始终停留在内容区
        window.addEventListener('wheel', (e) => {
            if (!scrollLock || e.deltaY >= 0) return;
            let delta = e.deltaY;
            if (e.deltaMode === 1) delta *= 40;                    // 行滚动
            else if (e.deltaMode === 2) delta *= window.innerHeight; // 页滚动
            if (window.scrollY + delta < window.innerHeight) {
                e.preventDefault();
                window.scrollTo(0, window.innerHeight);
            }
        }, { passive: false });
        // 兜底监听：任何越界滚动都会被立即纠正回内容区
        window.addEventListener('scroll', enforceScrollLock, { passive: true });
        await openDB();
        let existing = await getAll();
        if(existing.length === 0) { await bulkImport(DEFAULT); existing = DEFAULT.map(normalizeCommand); }
        commands = existing;
        await refresh();
        document.getElementById('searchInput').addEventListener('input', e => { curSearch = e.target.value; renderCards(); });
        const navSearchEl = document.getElementById('navSearch');
        const searchInputEl = document.getElementById('searchInput');
        if (navSearchEl && searchInputEl) {
            navSearchEl.addEventListener('click', () => {
                if (!navSearchEl.classList.contains('expanded')) {
                    navSearchEl.classList.add('expanded');
                    searchInputEl.focus();
                    // 点击搜索时，自动滚动到内容区
                    if (window.scrollY < window.innerHeight - 120) {
                        window.scrollTo({ top: window.innerHeight, behavior: 'smooth' });
                    }
                }
            });
            searchInputEl.addEventListener('focus', () => navSearchEl.classList.add('expanded'));
            searchInputEl.addEventListener('blur', () => {
                if (!searchInputEl.value.trim()) navSearchEl.classList.remove('expanded');
            });
        }
        document.getElementById('sidebarSearchInput').addEventListener('input', e => { catSearch = e.target.value; renderCatFilter(); });
        document.getElementById('openAddBtn').addEventListener('click', () => { resetModal(); document.getElementById('commandModal').style.display = 'flex'; });
        document.getElementById('saveBtn').addEventListener('click', () => { exportJSON(); showToast('备份已保存', true); });
        document.getElementById('closeModalBtn').addEventListener('click', () => { document.getElementById('commandModal').style.display = 'none'; resetModal(); });
        document.getElementById('commandForm').addEventListener('submit', onSave);
        document.getElementById('cmdCategory').addEventListener('change', e => { updateSubCatSelect(e.target.value, ''); updateSubSubCatSelect(e.target.value, '', ''); });
        document.getElementById('cmdSubCategory').addEventListener('change', e => updateSubSubCatSelect(document.getElementById('cmdCategory').value, e.target.value, ''));
        document.getElementById('exportJsonBtn').addEventListener('click', exportJSON);
        document.getElementById('exportMarkdownBtn').addEventListener('click', exportMarkdown);
        document.getElementById('exportCsvBtn').addEventListener('click', exportCSV);
        document.getElementById('exportTxtBtn').addEventListener('click', exportTxt);
        window.addEventListener('click', e => { if(e.target === document.getElementById('commandModal')) document.getElementById('commandModal').style.display = 'none'; if(e.target === document.getElementById('newCategoryModal')) closeNewCatModal(); if(e.target === document.getElementById('editCategoryModal')) closeEditCatModal(); if(e.target === document.getElementById('textInputModal')) closeTextInputModal(); if(e.target === document.getElementById('brandSettingsModal')) closeBrandSettingsModal(); if(e.target === document.getElementById('addSubdirModal')) closeAddSubdirModal(); if(e.target === document.getElementById('fullscreenModal')) closeFullscreen(); if(!e.target.closest('.cat-more-btn') && !e.target.closest('#catActionMenu')) hideCatMenu(); if(!e.target.closest('.bg-settings-wrapper')) closeBgPopover(); });
        document.getElementById('fsCloseBtn').addEventListener('click', closeFullscreen);
        document.getElementById('fsCopyBtn').addEventListener('click', async () => { if(currentFsCommand) await copyText(currentFsCommand.name); });
        document.getElementById('fsEditBtn').onclick = () => { if(currentFsCommand) openEdit(currentFsCommand); };
        setupImport();
        document.getElementById('quickAddCategoryBtn').addEventListener('click', () => openNewCatModal((newCat) => { updateCatSelect(); document.getElementById('cmdCategory').value = newCat; }));
        document.getElementById('addCodeBlockBtn').addEventListener('click', () => {
            document.getElementById('extraCodeBlocksContainer').appendChild(createCodeBlockItem());
        });
        document.getElementById('confirmNewCatBtn').addEventListener('click', createNewCat);
        document.getElementById('cancelNewCatBtn').addEventListener('click', closeNewCatModal);
        document.getElementById('saveGistConfigBtn').addEventListener('click', saveGistConfig);
        document.getElementById('uploadToGistNavBtn').addEventListener('click', uploadToGist);
        document.getElementById('downloadFromGistNavBtn').addEventListener('click', downloadFromGist);
        document.getElementById('gistTokenInput').value = gistToken;
        document.getElementById('gistIdInput').value = gistId;
        updateSyncStatus();

        // sidebar & mobile
        document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);
        document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
        document.getElementById('sidebarSyncToggle').addEventListener('click', toggleGistDrawer);
        document.getElementById('gistDrawerClose').addEventListener('click', closeGistDrawer);
        document.getElementById('gistDrawerOverlay').addEventListener('click', closeGistDrawer);
        document.getElementById('uploadToGistDrawerBtn').addEventListener('click', uploadToGist);
        document.getElementById('downloadFromGistDrawerBtn').addEventListener('click', downloadFromGist);
        document.getElementById('globalAddCategoryBtn').addEventListener('click', () => openNewCatModal(null));

        // close sidebar on pressing Escape
        document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSidebar(); hideCatMenu(); } });

        // category action menu buttons
        document.getElementById('catRenameBtn').addEventListener('click', () => {
            if (!currentCatMenuTarget) return;
            if (currentCatMenuSubSub) renameSubSubCategory(currentCatMenuTarget, currentCatMenuSub, currentCatMenuSubSub);
            else if (currentCatMenuSub) renameSubCategory(currentCatMenuTarget, currentCatMenuSub);
            else openEditCatModal(currentCatMenuTarget);
        });
        document.getElementById('catDeleteBtn').addEventListener('click', () => {
            if (!currentCatMenuTarget) return;
            if (currentCatMenuSubSub) deleteSubSubCategory(currentCatMenuTarget, currentCatMenuSub, currentCatMenuSubSub);
            else if (currentCatMenuSub) deleteSubCategory(currentCatMenuTarget, currentCatMenuSub);
            else deleteCategory(currentCatMenuTarget);
        });
        document.getElementById('catAddSubBtn').addEventListener('click', () => {
            if (!currentCatMenuTarget || currentCatMenuSubSub) return;
            if (currentCatMenuSub) addSubSubCategory(currentCatMenuTarget, currentCatMenuSub);
            else addSubCategory(currentCatMenuTarget);
        });
        document.getElementById('confirmAddSubdirBtn').addEventListener('click', confirmAddSubdir);
        document.getElementById('cancelAddSubdirBtn').addEventListener('click', closeAddSubdirModal);
        document.getElementById('addSubdirName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); confirmAddSubdir(); } });

        // edit category modal
        document.getElementById('confirmEditCatBtn').addEventListener('click', saveEditCategory);
        document.getElementById('cancelEditCatBtn').addEventListener('click', closeEditCatModal);

        initCustomLogo();
        initBrandText();
        loadSavedFavicon();
        initEffects();
        initSidebarResize();
        document.getElementById('customBrandBtn').addEventListener('click', openBrandSettingsModal);
        document.getElementById('brandText').addEventListener('dblclick', openBrandSettingsModal);
        document.getElementById('heroSubtitle').addEventListener('dblclick', customizeSubtitle);

        // 品牌设置弹窗
        document.getElementById('confirmBrandSettingsBtn').addEventListener('click', confirmBrandSettings);
        document.getElementById('cancelBrandSettingsBtn').addEventListener('click', closeBrandSettingsModal);
        document.getElementById('logoTypeSelect').addEventListener('change', () => updateBrandTypePlaceholder('logo'));
        document.getElementById('faviconTypeSelect').addEventListener('change', () => updateBrandTypePlaceholder('favicon'));
        document.getElementById('logoValueInput').addEventListener('input', renderLogoPreview);
        document.getElementById('faviconValueInput').addEventListener('input', renderFaviconPreview);
        document.getElementById('brandNameInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); confirmBrandSettings(); } });

        // 文字输入弹窗
        document.getElementById('confirmTextInputBtn').addEventListener('click', confirmTextInput);
        document.getElementById('cancelTextInputBtn').addEventListener('click', closeTextInputModal);
        document.getElementById('textInputField').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); confirmTextInput(); } });

        // 点击页面空白处弹出诗句
        const POEM_TEXT = '江畔何人初见雪、江雪何年初映人';
        document.addEventListener('click', e => {
            if (e.target.closest('button,input,textarea,select,a,.modal,.fullscreen-modal,#catActionMenu,.bg-settings-wrapper,.gist-drawer,.sidebar,.sidebar-overlay')) return;
            showPoemToast(e.clientX, e.clientY);
        });
        function showPoemToast(x, y) {
            const t = document.createElement('div');
            // 每次随机一个鲜艳的颜色（避开红色系），无背景，只有文字
            const hue = 30 + Math.floor(Math.random() * 300);
            t.style.cssText = `position:fixed;left:${x}px;top:${y}px;background:none;color:hsl(${hue},80%,50%);padding:10px 20px;font-size:0.95rem;font-weight:600;z-index:3000;pointer-events:none;white-space:nowrap;animation:poemFade 2.5s ease forwards;text-shadow:0 0 3px rgba(255,255,255,0.7),0 0 3px rgba(0,0,0,0.35);`;
            t.innerText = POEM_TEXT;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2600);
        }
        const poemStyle = document.createElement('style');
        poemStyle.textContent = '@keyframes poemFade{0%{opacity:0;transform:translate(-50%,10px) scale(0.9)}15%{opacity:1;transform:translate(-50%,0) scale(1)}70%{opacity:1;transform:translate(-50%,-20px) scale(1)}100%{opacity:0;transform:translate(-50%,-50px) scale(0.8)}}';
        document.head.appendChild(poemStyle);

        // 背景设置面板
        document.getElementById('bgImageBtn').addEventListener('click', e => { e.stopPropagation(); toggleBgPopover(); });
        document.getElementById('bgOpacitySlider').addEventListener('input', e => { updateOpacityDisplay(parseInt(e.target.value)); applyBgImageLive(parseInt(e.target.value)); });
        document.getElementById('bgApplyBtn').addEventListener('click', applyBgSettings);
        document.getElementById('bgClearBtn').addEventListener('click', clearBgSettings);
    }

    init();
</script>
